# Application name
spring.application.name=dpip

# Active Profile: 'local' uses H2 in-memory, 'prod' uses Supabase PostgreSQL
# Override with: --spring.profiles.active=prod  or  SPRING_PROFILES_ACTIVE=prod
spring.profiles.active=local

# CrewAI Agent Configuration
crewai.api.url=http://localhost:8081
ai.integration-mode=crewai

# GitHub Integration
github.pat=${GITHUB_PAT:}

