# ============================================================
# Supabase PostgreSQL Configuration (Environment Variables)
# ============================================================
# Set these environment variables before running:
#   SUPABASE_DB_URL       = jdbc:postgresql://db.<your-project-ref>.supabase.co:5432/postgres?sslmode=require&prepareThreshold=0
#   SUPABASE_DB_USERNAME  = postgres
#   SUPABASE_DB_PASSWORD  = <your-supabase-password>
# ============================================================
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USERNAME}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# HikariCP Connection Pool (tuned for Supabase Pooler)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.connection-test-query=SELECT 1

# Hibernate configuration
# Schema managed via Supabase migrations — Hibernate only validates
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=public
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.properties.hibernate.default_batch_fetch_size=16

# Disable H2 Console in production
spring.h2.console.enabled=false

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Logging
logging.level.com.zaxxer.hikari=INFO
logging.level.org.hibernate.SQL=WARN
